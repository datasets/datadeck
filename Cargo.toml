[package]
name = "datadeck"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
csv = "1"
calamine = { version = "0.31", features = ["dates"] }
parquet = { version = "56", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd", "base64", "simdutf8"] }
ureq = "3"
tempfile = "3"
async-channel = "2"
rusqlite = { version = "0.37", features = ["bundled", "hooks", "extra_check"] }
unicode-segmentation = "1"
url = "2"
regex = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
scraper = { version = "0.24", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
encoding_rs = "0.8"
plist = "1"

[profile.dev]
debug = 0

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"
