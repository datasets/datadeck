name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    environment: ${{ github.event_name == 'push' && 'macos-release' || 'macos-preview' }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag and native toolchain
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          rustup update stable --no-self-update
          rustup default stable
          rustc -vV
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            version=$(cargo metadata --locked --format-version 1 --no-deps | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "datadeck"))')
            if [[ ! $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || $GITHUB_REF_NAME != "v$version" ]]; then
              echo "The tag must match the stable Cargo.toml version v$version." >&2
              exit 1
            fi
          fi

      - name: Test and build native application
        run: |
          cargo test --locked --release
          scripts/package-macos.sh

      - name: Create unsigned preview for workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        run: scripts/macos-dmg.sh preview target/release/DataDeck.app "${{ matrix.arch }}" dist

      - name: Sign, notarize, staple and verify release disk image
        if: github.event_name == 'push'
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: scripts/macos-dmg.sh release target/release/DataDeck.app "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: datadeck-macos-${{ matrix.arch }}-${{ github.event_name == 'push' && 'release' || 'unsigned-preview' }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish notarized downloads
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: datadeck-macos-*-release
          path: dist
          merge-multiple: true

      - name: Verify both images and publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          tag=$GITHUB_REF_NAME
          prefix="DataDeck-${tag#v}-macos"
          files=("$prefix-arm64.dmg" "$prefix-x86_64.dmg")
          for file in "${files[@]}"; do
            test -s "$file"
            test -s "$file.sha256"
            sha256sum "$file" | diff - "$file.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            [[ $draft == true ]] || { echo "A public release already exists for $tag."; exit 1; }
          else
            gh release create "$tag" --draft --verify-tag --title "DataDeck $tag" --generate-notes --notes "Download arm64 for Apple silicon or x86_64 for Intel. Requires macOS 15 or later. Open the disk image and drag DataDeck into Applications. Both images are signed with Developer ID and notarized by Apple."
          fi
          gh release upload "$tag" "${files[@]}" SHA256SUMS --clobber
          gh release edit "$tag" --draft=false
